name: Fix ticket admin attachments v2

on:
  push:
    branches:
      - fix/ticket-admin-attachments-v2

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch
        run: python3 scripts/patch-ticket-admin-v2.py
      - name: Install dependencies
        run: npm ci
      - name: Validate project
        run: |
          npm run check
          node --check workspace/shared/ticketEnterprise.js
          node --check workspace/admin/assets/js/admin.js
          node --check workspace/admin/assets/js/ticketTransfer.js
          node --check api/admin-enterprise.js
          node --check api/attachment.js
          grep -q 'id="assigneeControl"' workspace/admin/ticketAdmin.html
          ! grep -q 'id="assigneeControl" disabled' workspace/admin/ticketAdmin.html
          grep -q "eventType=wantsUnassign?'unassign':(isInitialAssignment?'assign':'transfer')" api/admin-enterprise.js
          grep -q 'Atribuição inicial pelo painel administrativo' api/admin-enterprise.js
          ! grep -q 'new MutationObserver' workspace/shared/ticketEnterprise.js
      - name: Commit validated changes and remove temporary files
        run: |
          rm -f scripts/patch-ticket-admin-v2.py .github/workflows/fix-ticket-admin-attachments-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: estabilizar anexos e liberar atribuição de chamados"
          git push
