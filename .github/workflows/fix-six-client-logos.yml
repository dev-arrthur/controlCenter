name: Fix six client logos

on:
  push:
    paths:
      - '.github/workflows/fix-six-client-logos.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Adjust client carousel sizing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'gap: 58px;\n            animation: clientLogoCarousel 28s linear infinite;': 'gap: 18px;\n            animation: clientLogoCarousel 24s linear infinite;',
              'width: 185px;\n            min-width: 185px;\n            min-height: 76px;': 'width: 120px;\n            min-width: 120px;\n            min-height: 64px;',
              'max-width: 180px;\n            max-height: 70px;': 'max-width: 120px;\n            max-height: 58px;',
              'translate3d(calc(-50% - 29px), 0, 0)': 'translate3d(calc(-50% - 9px), 0, 0)',
              '-webkit-mask-image: linear-gradient(90deg, transparent, #000 7%, #000 93%, transparent);': '-webkit-mask-image: linear-gradient(90deg, transparent, #000 2%, #000 98%, transparent);',
              'mask-image: linear-gradient(90deg, transparent, #000 7%, #000 93%, transparent);': 'mask-image: linear-gradient(90deg, transparent, #000 2%, #000 98%, transparent);',
              '.client-logos-track { gap: 42px; animation-duration: 24s; }': '.client-logos-track { gap: 24px; animation-duration: 22s; }',
              '.client-logo { width: 165px; min-width: 165px; min-height: 70px; }': '.client-logo { width: 145px; min-width: 145px; min-height: 66px; }',
              '.client-logo img { max-width: 160px; max-height: 62px; }': '.client-logo img { max-width: 145px; max-height: 58px; }'
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Expected CSS fragment not found: {old[:50]}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: display all six client logos in carousel" || exit 0
          git push
