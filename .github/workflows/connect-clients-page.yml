name: Connect clients page

on:
  push:
    paths:
      - '.github/workflows/connect-clients-page.yml'

permissions:
  contents: write

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Clients navigation and homepage logo links
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          home = Path('index.html')
          html = home.read_text(encoding='utf-8')
          html = html.replace('href="#clientes"', 'href="pages/clients/index.html"')

          logo_links = {
              '<div class="client-logo"><img src="imgs/client-maximum.png" alt="Maximum Assessoria Contábil" loading="lazy"></div>': '<a class="client-logo" href="pages/clients/index.html#maximum" aria-label="Conhecer o case da Maximum"><img src="imgs/client-maximum.png" alt="Maximum Assessoria Contábil" loading="lazy"></a>',
              '<div class="client-logo"><img src="imgs/client-savino.png" alt="Grupo Savino" loading="lazy"></div>': '<a class="client-logo" href="pages/clients/index.html#savino" aria-label="Conhecer o case do Grupo Savino"><img src="imgs/client-savino.png" alt="Grupo Savino" loading="lazy"></a>',
              '<div class="client-logo"><img src="imgs/client-martins-teixeira.png" alt="Martins Teixeira Consultoria Previdenciária" loading="lazy"></div>': '<a class="client-logo" href="pages/clients/index.html#martins" aria-label="Conhecer o case da Martins Teixeira"><img src="imgs/client-martins-teixeira.png" alt="Martins Teixeira Consultoria Previdenciária" loading="lazy"></a>',
              '<div class="client-logo"><img src="imgs/client-implante-rio.png" alt="Implante Rio" loading="lazy"></div>': '<a class="client-logo" href="pages/clients/index.html#implante" aria-label="Conhecer o case da Implante Rio"><img src="imgs/client-implante-rio.png" alt="Implante Rio" loading="lazy"></a>',
              '<div class="client-logo"><img src="imgs/client-minas-gonzaga.jpg" alt="Minas Gonzaga Representações" loading="lazy"></div>': '<a class="client-logo" href="pages/clients/index.html#minas" aria-label="Conhecer o case da Minas Gonzaga"><img src="imgs/client-minas-gonzaga.jpg" alt="Minas Gonzaga Representações" loading="lazy"></a>',
              '<div class="client-logo"><img src="imgs/client-top-fitness.jpg" alt="Top Fitness" loading="lazy"></div>': '<a class="client-logo" href="pages/clients/index.html#top" aria-label="Conhecer o case da Top Fitness"><img src="imgs/client-top-fitness.jpg" alt="Top Fitness" loading="lazy"></a>',
          }
          for old, new in logo_links.items():
              html = html.replace(old, new)
          home.write_text(html, encoding='utf-8')

          company = Path('pages/company/index.html')
          text = company.read_text(encoding='utf-8')
          text = text.replace('href="../../index.html#clientes"', 'href="../clients/index.html"')
          company.write_text(text, encoding='utf-8')

          for path in Path('pages/solutions').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              text = text.replace('href="../../index.html#clientes"', 'href="../clients/index.html"')
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit links
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html pages/company/index.html pages/solutions/*.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "feat: connect clients cases experience across site"
          git push
