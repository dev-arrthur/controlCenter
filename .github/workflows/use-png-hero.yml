name: Apply PNG hero image

on:
  push:
    paths:
      - '.github/workflows/use-png-hero.yml'

permissions:
  contents: write

jobs:
  update-hero:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update index to use PNG hero image
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          html = html.replace('imgs/section-1-controlcenter.avif', 'imgs/imagem1ControlTech.png')
          html = html.replace('type="image/avif"', 'type="image/png"', 1)
          html = html.replace('width="400" height="267"', 'width="1536" height="1024"', 1)
          path.write_text(html, encoding='utf-8')
          PY

      - name: Commit update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "fix: use imagem1ControlTech.png in section 1"
          git push
