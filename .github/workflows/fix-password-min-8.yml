name: Fix password minimum to 8

on:
  push:
    branches:
      - fix/password-min-8

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/password-min-8
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Apply password rule
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          roots = [Path('api'), Path('workspace'), Path('scripts')]
          replacements = [
              ('password.length >= 12', 'password.length >= 8'),
              ('password.length>=12', 'password.length>=8'),
              ('value.length >= 12', 'value.length >= 8'),
              ('value.length>=12', 'value.length>=8'),
              ('password.length >= 10', 'password.length >= 8'),
              ('password.length>=10', 'password.length>=8'),
              ('pelo menos 12 caracteres', 'pelo menos 8 caracteres'),
              ('Pelo menos 12 caracteres', 'Pelo menos 8 caracteres'),
              ('no mínimo 12 caracteres', 'no mínimo 8 caracteres'),
              ('No mínimo 12 caracteres', 'No mínimo 8 caracteres'),
              ('pelo menos 10 caracteres', 'pelo menos 8 caracteres'),
              ('Pelo menos 10 caracteres', 'Pelo menos 8 caracteres'),
              ('Mínimo de 10 caracteres, com letras e números.', 'Mínimo de 8 caracteres, com maiúscula, minúscula, número e símbolo.'),
              ('Mínimo de 12 caracteres, com letras e números.', 'Mínimo de 8 caracteres, com maiúscula, minúscula, número e símbolo.'),
              ('minlength="12"', 'minlength="8"'),
              ('minlength="10"', 'minlength="8"'),
              ("portal passwords must require at least 12 characters", "portal passwords must require at least 8 characters"),
          ]

          changed = []
          for root in roots:
              for path in root.rglob('*'):
                  if not path.is_file() or path.suffix.lower() not in {'.js', '.html', '.md'}:
                      continue
                  text = path.read_text(encoding='utf-8')
                  original = text
                  for old, new in replacements:
                      text = text.replace(old, new)
                  if text != original:
                      path.write_text(text, encoding='utf-8')
                      changed.append(str(path))

          print('Changed files:')
          for item in changed:
              print(' -', item)

          required = {
              'api/portal.js': 'password.length >= 8',
              'api/admin-enterprise.js': 'value.length>=8',
              'workspace/admin/teamAdmin.html': 'minlength="8"',
              'workspace/admin/changePasswordAdmin.html': 'minlength="8"',
              'workspace/client/profile.html': 'minlength="8"',
              'workspace/admin/clientsAdmin.html': 'minlength="8"',
              'scripts/check-enterprise-contract.js': "password.length >= 8",
          }
          for file, expected in required.items():
              content = Path(file).read_text(encoding='utf-8')
              if expected not in content:
                  raise SystemExit(f'Expected password rule not found in {file}: {expected}')

          forbidden = ['password.length >= 12', 'password.length>=12', 'value.length>=12', 'minlength="12"', 'minlength="10"', 'pelo menos 12 caracteres', 'no mínimo 12 caracteres']
          for root in roots:
              for path in root.rglob('*'):
                  if not path.is_file() or path.suffix.lower() not in {'.js', '.html', '.md'}:
                      continue
                  content = path.read_text(encoding='utf-8')
                  for token in forbidden:
                      if token in content:
                          raise SystemExit(f'Old password rule remains in {path}: {token}')
          PY
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate project
        run: |
          npm run check
          node scripts/check-enterprise-contract.js
          node --check api/portal.js
          node --check api/admin-enterprise.js
      - name: Commit validated change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-password-min-8.yml
          git add api workspace scripts
          git commit -m "fix: definir mínimo de 8 caracteres para senhas"
          git push origin HEAD:fix/password-min-8
