name: Validate enterprise portal

on:
  push:
    branches:
      - feat/portal-enterprise-realtime-security

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/portal-enterprise-realtime-security

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Apply final integration patches
        run: python3 scripts/finalize-enterprise.py

      - name: Update dependency lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Install exact dependencies
        run: npm ci --ignore-scripts

      - name: Validate project
        run: npm run check

      - name: Validate JavaScript syntax
        run: |
          node --check api/portal.js
          node --check api/gateway.js
          node --check api/_portal-security.js
          node --check api/admin-enterprise.js
          node --check api/attachment.js
          node --check api/socket.js
          node --check workspace/shared/ticketEnterprise.js
          node --check workspace/client/assets/js/portal.js
          node --check workspace/admin/assets/js/admin.js
          node --check workspace/admin/assets/js/teamAccess.js
          node --check workspace/admin/assets/js/ticketTransfer.js

      - name: Validate security contract
        run: node scripts/check-enterprise-contract.js

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json api/portal.js workspace/client/ticket.html workspace/admin/assets/js/admin.js
          if ! git diff --cached --quiet; then
            git commit -m "fix: finalizar integração enterprise validada"
            git push origin HEAD:feat/portal-enterprise-realtime-security
          fi
