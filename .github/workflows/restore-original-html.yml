name: Restore original HTML and static Section 1

on:
  push:
    paths:
      - '.github/workflows/restore-original-html.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore supplied layout and apply only requested assets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('index.backup.html')
          target = Path('index.html')
          html = source.read_text(encoding='utf-8')

          html = html.replace(
              'type="image/png"\n        href="assets/images/logo-controlcenter.png"',
              'type="image/webp"\n        href="imgs/logo-controlcenter.webp"'
          )
          html = html.replace(
              'src="assets/images/logo-controlcenter.png"',
              'src="imgs/logo-controlcenter.webp"'
          )

          css_start = html.index('        .hero-visual {')
          css_end = html.index('        .hero-panel {', css_start)
          static_css = (
              '        .hero-visual {\n'
              '            min-height: 590px;\n\n'
              '            position: relative;\n\n'
              '            display: flex;\n'
              '            align-items: center;\n'
              '            justify-content: center;\n\n'
              '            background: transparent;\n\n'
              '            animation: none;\n'
              '        }\n\n'
              '        .hero-art {\n'
              '            width: min(760px, 118%);\n'
              '            max-width: none;\n'
              '            height: auto;\n\n'
              '            position: relative;\n\n'
              '            display: block;\n\n'
              '            object-fit: contain;\n\n'
              '            background: transparent;\n'
              '            border: 0;\n'
              '            box-shadow: none;\n'
              '            transform: none;\n'
              '            animation: none;\n'
              '            transition: none;\n\n'
              '            filter: drop-shadow(0 28px 24px rgba(23,79,130,.10));\n'
              '        }\n\n'
          )
          html = html[:css_start] + static_css + html[css_end:]

          visual_start = html.index('        <div class="hero-visual">')
          visual_end = html.index('\n\n\n    </div>\n\n</section>', visual_start)
          static_visual = (
              '        <div class="hero-visual">\n\n'
              '            <img\n'
              '                class="hero-art"\n'
              '                src="imgs/imagem1ControlTech.png"\n'
              '                width="1536"\n'
              '                height="1024"\n'
              '                alt="Ecossistema ControlCenter com servidores, nuvem, segurança, suporte e gestão"\n'
              '                fetchpriority="high"\n'
              '                decoding="async"\n'
              '            >\n\n'
              '        </div>'
          )
          html = html[:visual_start] + static_visual + html[visual_end:]

          target.write_text(html, encoding='utf-8')
          PY

      - name: Commit restored index
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "fix: restore original HTML with static Section 1 image"
          git push
