name: Fix navigation footers

on:
  push:
    paths:
      - '.github/workflows/fix-navigation-footers.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update links and footers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          company_footer = '''<footer class="company-footer"><div class="container"><div class="company-footer-grid"><div class="company-footer-brand"><img src="../../imgs/logo-controlcenter.webp" alt="ControlCenter"><p>Infraestrutura, segurança, suporte e gestão de TI para empresas que precisam manter suas operações disponíveis, protegidas e produtivas.</p></div><div><h4>Institucional</h4><a href="../../index.html#inicio">Home</a><a href="index.html">Empresa</a><a href="../../index.html#clientes">Clientes</a><a href="../../index.html#insights">Conteúdos</a><a href="../../index.html#contato">Contato</a></div><div><h4>Infraestrutura</h4><a href="../solutions/gestao-de-redes.html">Gestão de Redes</a><a href="../solutions/servidores.html">Servidores</a><a href="../solutions/wifi-corporativo.html">Wi-Fi Corporativo</a><a href="../solutions/conectividade.html">Conectividade</a></div><div><h4>Segurança</h4><a href="../solutions/seguranca.html">Segurança</a><a href="../solutions/firewall.html">Firewall</a><a href="../solutions/backup.html">Backup</a><a href="../solutions/monitoramento.html">Monitoramento</a></div><div><h4>Serviços</h4><a href="../solutions/suporte-remoto.html">Suporte Remoto</a><a href="../solutions/suporte-presencial.html">Suporte Presencial</a><a href="../solutions/gestao-de-ti.html">Gestão de TI</a><a href="../solutions/manutencao.html">Manutenção</a></div></div><div class="company-footer-bottom"><span>© 2026 ControlCenter. Todos os direitos reservados.</span><a href="../../index.html#contato">Falar com a ControlCenter</a></div></div></footer>'''

          cp = Path('pages/company/index.html')
          html = cp.read_text(encoding='utf-8')
          html = re.sub(r'<footer class="company-footer">.*?</footer>', company_footer, html, flags=re.S)
          cp.write_text(html, encoding='utf-8')

          solution_footer = '''<footer class="footer"><div class="container"><div class="footer-grid footer-grid-complete"><div class="footer-brand"><img src="../../imgs/logo-controlcenter.webp" alt="ControlCenter"><p>Tecnologia para empresas que não podem parar.</p></div><div><h4>Institucional</h4><a href="../../index.html#inicio">Home</a><a href="../company/index.html">Empresa</a><a href="../../index.html#clientes">Clientes</a><a href="../../index.html#insights">Conteúdos</a><a href="../../index.html#contato">Contato</a></div><div><h4>Infraestrutura</h4><a href="gestao-de-redes.html">Gestão de Redes</a><a href="servidores.html">Servidores</a><a href="wifi-corporativo.html">Wi-Fi Corporativo</a><a href="conectividade.html">Conectividade</a></div><div><h4>Segurança</h4><a href="seguranca.html">Segurança</a><a href="firewall.html">Firewall</a><a href="backup.html">Backup</a><a href="monitoramento.html">Monitoramento</a></div><div><h4>Serviços</h4><a href="suporte-remoto.html">Suporte Remoto</a><a href="suporte-presencial.html">Suporte Presencial</a><a href="gestao-de-ti.html">Gestão de TI</a><a href="manutencao.html">Manutenção</a></div></div><div class="footer-bottom"><span>© 2026 ControlCenter. Todos os direitos reservados.</span><a href="../../index.html#contato">Falar com a ControlCenter</a></div></div></footer>'''

          for p in Path('pages/solutions').glob('*.html'):
              h = p.read_text(encoding='utf-8')
              h = h.replace('href="../../index.html#empresa"','href="../company/index.html"')
              h = re.sub(r'<footer class="footer">.*?</footer>', solution_footer, h, flags=re.S)
              p.write_text(h, encoding='utf-8')

          cssp = Path('pages/solutions/solutions.css')
          css = cssp.read_text(encoding='utf-8')
          marker = '/* COMPLETE FOOTER LAYOUT */'
          if marker not in css:
              css += '\n'+marker+'\n.footer-grid.footer-grid-complete{grid-template-columns:1.35fr repeat(4,1fr);gap:38px}.footer-grid.footer-grid-complete>div{min-width:0}@media(max-width:1100px){.footer-grid.footer-grid-complete{grid-template-columns:1.3fr repeat(2,1fr)}.footer-grid.footer-grid-complete .footer-brand{grid-row:span 2}}@media(max-width:760px){.footer-grid.footer-grid-complete{grid-template-columns:1fr 1fr}.footer-grid.footer-grid-complete .footer-brand{grid-column:1/-1;grid-row:auto}}@media(max-width:520px){.footer-grid.footer-grid-complete{grid-template-columns:1fr}.footer-grid.footer-grid-complete .footer-brand{grid-column:auto}}\n'
          cssp.write_text(css, encoding='utf-8')

          home_footer = '''<footer class="footer"><div class="container"><div class="footer-grid"><div class="footer-brand"><a class="footer-logo" href="#inicio" aria-label="ControlCenter - Home"><img src="imgs/logo-controlcenter.webp" alt="ControlCenter"></a><p>Infraestrutura, segurança, suporte e gestão de TI para empresas que precisam manter suas operações disponíveis, protegidas e produtivas.</p></div><div class="footer-column"><h4>Institucional</h4><a href="#inicio"><i class="bi bi-arrow-right"></i>Home</a><a href="pages/company/index.html"><i class="bi bi-arrow-right"></i>Empresa</a><a href="#clientes"><i class="bi bi-arrow-right"></i>Clientes</a><a href="#insights"><i class="bi bi-arrow-right"></i>Conteúdos</a><a href="#contato"><i class="bi bi-arrow-right"></i>Contato</a></div><div class="footer-column"><h4>Infraestrutura</h4><a href="pages/solutions/gestao-de-redes.html"><i class="bi bi-diagram-3"></i>Gestão de Redes</a><a href="pages/solutions/servidores.html"><i class="bi bi-server"></i>Servidores</a><a href="pages/solutions/wifi-corporativo.html"><i class="bi bi-wifi"></i>Wi-Fi Corporativo</a><a href="pages/solutions/conectividade.html"><i class="bi bi-router"></i>Conectividade</a></div><div class="footer-column"><h4>Segurança</h4><a href="pages/solutions/seguranca.html"><i class="bi bi-shield-check"></i>Segurança</a><a href="pages/solutions/firewall.html"><i class="bi bi-bricks"></i>Firewall</a><a href="pages/solutions/backup.html"><i class="bi bi-cloud-arrow-up"></i>Backup</a><a href="pages/solutions/monitoramento.html"><i class="bi bi-activity"></i>Monitoramento</a></div><div class="footer-column"><h4>Serviços</h4><a href="pages/solutions/suporte-remoto.html"><i class="bi bi-headset"></i>Suporte Remoto</a><a href="pages/solutions/suporte-presencial.html"><i class="bi bi-person-workspace"></i>Suporte Presencial</a><a href="pages/solutions/gestao-de-ti.html"><i class="bi bi-gear"></i>Gestão de TI</a><a href="pages/solutions/manutencao.html"><i class="bi bi-tools"></i>Manutenção</a></div></div><div class="footer-bottom"><span>© 2026 ControlCenter. Todos os direitos reservados.</span><a href="#contato">Falar com a ControlCenter</a></div></div></footer>'''
          hp = Path('index.html')
          home = hp.read_text(encoding='utf-8')
          home = re.sub(r'<footer class="footer">.*?</footer>', home_footer, home, flags=re.S)
          hp.write_text(home, encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html pages/company pages/solutions
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: complete navbar and footer redirects"
          git push
