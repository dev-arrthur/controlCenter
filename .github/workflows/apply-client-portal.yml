name: Apply client portal

on:
  push:
    branches:
      - feat/client-ticket-portal
    paths:
      - '.github/workflows/apply-client-portal.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/client-ticket-portal

      - name: Extract portal implementation
        shell: bash
        run: |
          cat > /tmp/ccportal.b64 <<'PAYLOAD'
[... ELLIPSIZATION ...]
PAYLOAD
          base64 -d /tmp/ccportal.b64 > /tmp/ccportal.tgz
          tar -xzf /tmp/ccportal.tgz -C .

      - name: Point every Area do Cliente link to the portal
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_area_links(path, target):
              text = path.read_text(encoding='utf-8')
              def repl(match):
                  tag = match.group(0)
                  plain = re.sub(r'<[^>]+>', ' ', tag)
                  plain = re.sub(r'\s+', ' ', plain).strip()
                  if 'Área do Cliente' not in plain:
                      return tag
                  if re.search(r'href="[^"]*"', tag):
                      return re.sub(r'href="[^"]*"', f'href="{target}"', tag, count=1)
                  return tag
              text = re.sub(r'<a\b[^>]*>.*?</a>', repl, text, flags=re.S|re.I)
              path.write_text(text, encoding='utf-8')

          replace_area_links(Path('index.html'), 'workspace/client/loginClient.html')

          internal = [
              Path('pages/company/index.html'),
              Path('pages/clients/index.html'),
              Path('pages/contact/index.html'),
              Path('pages/contents/index.html'),
              *sorted(Path('pages/solutions').glob('*.html')),
          ]
          for path in internal:
              replace_area_links(path, '../../workspace/client/loginClient.html')

          for path in sorted(Path('pages/contents/articles').glob('*.html')):
              replace_area_links(path, '../../../workspace/client/loginClient.html')

          print('Area do Cliente links updated.')
          PY

      - name: Validate Node project
        shell: bash
        run: |
          npm install --ignore-scripts
          npm run check
          node -e "require('mongodb'); require('bcryptjs'); require('jsonwebtoken'); console.log('Runtime dependencies OK')"

      - name: Commit portal
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .env.example .gitignore PORTAL_CLIENTE.md package.json package-lock.json vercel.json api scripts workspace index.html pages
          git commit -m "feat: criar portal de chamados da área do cliente"
          git push origin HEAD:feat/client-ticket-portal
