name: Apply unified footer

on:
  push:
    branches:
      - feat/unified-footer-thynkxp
    paths:
      - '.github/workflows/apply-unified-footer.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/unified-footer-thynkxp

      - name: Standardize footer across every HTML page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          template = Path('pages/shared/site-footer-template.html').read_text(encoding='utf-8')

          def config(level):
              if level == 'root':
                  return dict(logo='imgs/logo-controlcenter.webp', home='#inicio', company='pages/company/index.html', clients='pages/clients/index.html', contents='pages/contents/index.html', contact='#contato', solutions='pages/solutions/', css='pages/shared/site-footer.css')
              if level == 'article':
                  return dict(logo='../../../imgs/logo-controlcenter.webp', home='../../../index.html#inicio', company='../../company/index.html', clients='../../clients/index.html', contents='../index.html', contact='../../../index.html#contato', solutions='../../solutions/', css='../../shared/site-footer.css')
              return dict(logo='../../imgs/logo-controlcenter.webp', home='../../index.html#inicio', company='../company/index.html', clients='../clients/index.html', contents='../contents/index.html', contact='../../index.html#contato', solutions='../solutions/', css='../shared/site-footer.css')

          def update_page(path, level):
              values = config(level)
              footer = template.format(**values)
              text = path.read_text(encoding='utf-8')
              text = re.sub(r'\s*<link[^>]+site-footer\.css[^>]*>\s*', '\n', text, flags=re.I)
              if '</head>' not in text:
                  raise RuntimeError(f'Missing head in {path}')
              text = text.replace('</head>', f'<link rel="stylesheet" href="{values["css"]}"></head>', 1)
              text, count = re.subn(r'<footer\b[^>]*>.*?</footer>', footer, text, count=1, flags=re.S | re.I)
              if count != 1:
                  raise RuntimeError(f'Expected one footer in {path}, found {count}')
              path.write_text(text, encoding='utf-8')

          pages = [(Path('index.html'), 'root')]
          pages += [(Path('pages/company/index.html'), 'internal'), (Path('pages/clients/index.html'), 'internal'), (Path('pages/contents/index.html'), 'internal')]
          pages += [(p, 'internal') for p in sorted(Path('pages/solutions').glob('*.html'))]
          pages += [(p, 'article') for p in sorted(Path('pages/contents/articles').glob('*.html'))]

          for path, level in pages:
              update_page(path, level)

          print(f'Unified footer applied to {len(pages)} pages')
          PY

      - name: Commit footer rollout
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html pages/company/index.html pages/clients/index.html pages/contents/index.html pages/contents/articles/*.html pages/solutions/*.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "feat: unify footer and add thynkXP credit"
          git push origin HEAD:feat/unified-footer-thynkxp
