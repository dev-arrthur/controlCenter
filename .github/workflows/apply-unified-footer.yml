name: Apply unified footer

on:
  push:
    branches:
      - feat/unified-footer-thynkxp
    paths:
      - '.github/workflows/apply-unified-footer.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/unified-footer-thynkxp

      - name: Standardize footer across every HTML page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def footer_markup(level):
              if level == 'root':
                  logo = 'imgs/logo-controlcenter.webp'
                  home = '#inicio'
                  company = 'pages/company/index.html'
                  clients = 'pages/clients/index.html'
                  contents = 'pages/contents/index.html'
                  contact = '#contato'
                  solutions = 'pages/solutions/'
                  css = 'pages/shared/site-footer.css'
              elif level == 'article':
                  logo = '../../../imgs/logo-controlcenter.webp'
                  home = '../../../index.html#inicio'
                  company = '../../company/index.html'
                  clients = '../../clients/index.html'
                  contents = '../index.html'
                  contact = '../../../index.html#contato'
                  solutions = '../../solutions/'
                  css = '../../shared/site-footer.css'
              else:
                  logo = '../../imgs/logo-controlcenter.webp'
                  home = '../../index.html#inicio'
                  company = '../company/index.html'
                  clients = '../clients/index.html'
                  contents = '../contents/index.html'
                  contact = '../../index.html#contato'
                  solutions = '../solutions/'
                  css = '../shared/site-footer.css'

              html = f'''<footer class="site-footer">
  <div class="site-footer-container">
    <div class="site-footer-main">
      <div class="site-footer-brand">
        <a class="site-footer-logo" href="{home}" aria-label="ControlCenter - Home"><img src="{logo}" alt="ControlCenter"></a>
        <p>Infraestrutura, segurança, suporte e gestão de TI para empresas que precisam manter suas operações disponíveis, protegidas e produtivas.</p>
      </div>

      <div class="site-footer-column">
        <h4>Institucional</h4>
        <nav>
          <a href="{home}"><i class="bi bi-arrow-right"></i>Home</a>
          <a href="{company}"><i class="bi bi-arrow-right"></i>Empresa</a>
          <a href="{clients}"><i class="bi bi-arrow-right"></i>Clientes</a>
          <a href="{contents}"><i class="bi bi-arrow-right"></i>Conteúdos</a>
          <a href="{contact}"><i class="bi bi-arrow-right"></i>Contato</a>
        </nav>
      </div>

      <div class="site-footer-column">
        <h4>Infraestrutura</h4>
        <nav>
          <a href="{solutions}gestao-de-redes.html"><i class="bi bi-diagram-3"></i>Gestão de Redes</a>
          <a href="{solutions}servidores.html"><i class="bi bi-server"></i>Servidores</a>
          <a href="{solutions}wifi-corporativo.html"><i class="bi bi-wifi"></i>Wi-Fi Corporativo</a>
          <a href="{solutions}conectividade.html"><i class="bi bi-router"></i>Conectividade</a>
        </nav>
      </div>

      <div class="site-footer-column">
        <h4>Segurança</h4>
        <nav>
          <a href="{solutions}seguranca.html"><i class="bi bi-shield-check"></i>Segurança</a>
          <a href="{solutions}firewall.html"><i class="bi bi-bricks"></i>Firewall</a>
          <a href="{solutions}backup.html"><i class="bi bi-cloud-arrow-up"></i>Backup</a>
          <a href="{solutions}monitoramento.html"><i class="bi bi-activity"></i>Monitoramento</a>
        </nav>
      </div>

      <div class="site-footer-column">
        <h4>Serviços</h4>
        <nav>
          <a href="{solutions}suporte-remoto.html"><i class="bi bi-headset"></i>Suporte Remoto</a>
          <a href="{solutions}suporte-presencial.html"><i class="bi bi-person-workspace"></i>Suporte Presencial</a>
          <a href="{solutions}gestao-de-ti.html"><i class="bi bi-gear"></i>Gestão de TI</a>
          <a href="{solutions}manutencao.html"><i class="bi bi-tools"></i>Manutenção</a>
        </nav>
      </div>
    </div>

    <div class="site-footer-bottom">
      <span class="site-footer-copy">© 2026 ControlCenter. Todos os direitos reservados.</span>
      <span class="site-footer-credit"><span>Desenvolvido por</span><strong>thynkXP</strong></span>
      <a class="site-footer-contact" href="{contact}">Falar com a ControlCenter <i class="bi bi-arrow-up-right"></i></a>
    </div>
  </div>
</footer>'''
              return html, css

          def update_page(path, level):
              text = path.read_text(encoding='utf-8')
              footer, css = footer_markup(level)

              text = re.sub(r'\s*<link[^>]+site-footer\.css[^>]*>\s*', '\n', text, flags=re.I)
              if '</head>' not in text:
                  raise RuntimeError(f'Missing </head> in {path}')
              text = text.replace('</head>', f'<link rel="stylesheet" href="{css}"></head>', 1)

              new_text, count = re.subn(r'<footer\b[^>]*>.*?</footer>', footer, text, count=1, flags=re.S | re.I)
              if count != 1:
                  raise RuntimeError(f'Expected one footer in {path}, found {count}')
              path.write_text(new_text, encoding='utf-8')

          pages = [(Path('index.html'), 'root')]
          pages += [
              (Path('pages/company/index.html'), 'internal'),
              (Path('pages/clients/index.html'), 'internal'),
              (Path('pages/contents/index.html'), 'internal'),
          ]
          pages += [(p, 'internal') for p in sorted(Path('pages/solutions').glob('*.html'))]
          pages += [(p, 'article') for p in sorted(Path('pages/contents/articles').glob('*.html'))]

          for path, level in pages:
              update_page(path, level)

          print(f'Unified footer applied to {len(pages)} pages.')
          PY

      - name: Commit footer rollout
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html pages/company/index.html pages/clients/index.html pages/contents/index.html pages/contents/articles/*.html pages/solutions/*.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "feat: unify footer and add thynkXP credit"
          git push origin HEAD:feat/unified-footer-thynkxp
