name: Apply client carousel

on:
  push:
    paths:
      - '.github/workflows/apply-client-carousel.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update page
        run: python tools/apply-client-carousel.py
      - name: Commit page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: add client logo carousel and refine hero spacing"
          git push
