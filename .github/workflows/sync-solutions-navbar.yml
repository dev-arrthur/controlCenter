name: Sync solutions navigation

on:
  push:
    paths:
      - '.github/workflows/sync-solutions-navbar.yml'
      - 'tools/sync_solutions_nav.py'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync navbar and redirects
        run: python tools/sync_solutions_nav.py
      - name: Commit navigation changes
        run: |
          rm -f .github/workflows/sync-solutions-navbar.yml tools/sync_solutions_nav.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html pages/solutions .github/workflows/sync-solutions-navbar.yml tools/sync_solutions_nav.py
          git commit -m "feat: align solution navbar and home redirects"
          git push
