name: Attachment image modal

on:
  push:
    branches:
      - fix/attachment-image-modal

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch
        run: python3 scripts/patch-attachment-modal.py
      - name: Install dependencies
        run: npm ci
      - name: Validate
        run: |
          npm run check
          node --check workspace/shared/ticketEnterprise.js
          grep -q 'attachment-image-modal-card' workspace/shared/portalEnterprise.css
          grep -q 'data-image-preview="1"' workspace/shared/ticketEnterprise.js
          ! grep -q 'Anexos aguardando configuração do storage privado' workspace/client/ticket.html
          ! grep -q 'Storage privado ainda não configurado' workspace/admin/ticketAdmin.html
      - name: Commit validated changes and remove temporary files
        run: |
          rm -f scripts/patch-attachment-modal.py .github/workflows/attachment-image-modal.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: abrir anexos de imagem em modal"
          git push
