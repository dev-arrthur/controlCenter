name: Fix attachment session binding

on:
  push:
    branches:
      - fix/attachment-session-binding

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/attachment-session-binding
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply secure attachment session patch
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Pattern not found in {path}: {old[:100]!r}')
              if text.count(old) != 1:
                  raise SystemExit(f'Expected one occurrence in {path}, got {text.count(old)}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          attachment = 'api/attachment.js'
          replace_once(
              attachment,
              "const {\n  ObjectId,\n  authenticateCookieHeader,",
              "const {\n  ObjectId,\n  CLIENT_COOKIE,\n  ADMIN_COOKIE,\n  authenticateCookieHeader,"
          )

          replace_once(
              attachment,
              "function sameOrigin(req) {\n  const origin = req.headers.origin;\n  if (!origin) return true;\n  try {\n    const host = req.headers['x-forwarded-host'] || req.headers.host;\n    return !host || new URL(origin).host === host;\n  } catch { return false; }\n}\n",
              "function sameOrigin(req) {\n  const origin = req.headers.origin;\n  if (!origin) return true;\n  try {\n    const host = req.headers['x-forwarded-host'] || req.headers.host;\n    return !host || new URL(origin).host === host;\n  } catch { return false; }\n}\nfunction requestedPortalKind(req) {\n  const raw = String(req.query?.portal || req.headers['x-portal-kind'] || '').trim().toLowerCase();\n  return raw === 'admin' || raw === 'client' ? raw : '';\n}\nfunction scopedCookieHeader(req, portalKind) {\n  const raw = String(req.headers.cookie || '');\n  if (!portalKind) return raw;\n  const wanted = portalKind === 'admin' ? ADMIN_COOKIE : CLIENT_COOKIE;\n  return raw\n    .split(';')\n    .map(part => part.trim())\n    .filter(part => part.startsWith(`${wanted}=`))\n    .join('; ');\n}\n"
          )

          replace_once(
              attachment,
              "function publicAttachment(doc) {",
              "function publicAttachment(doc, portalKind = '') {"
          )
          replace_once(
              attachment,
              "    downloadUrl: `/api/attachment?action=download&id=${encodeURIComponent(String(doc._id))}`",
              "    downloadUrl: `/api/attachment?action=download&id=${encodeURIComponent(String(doc._id))}${portalKind ? `&portal=${encodeURIComponent(portalKind)}` : ''}`"
          )

          replace_once(
              attachment,
              "    const session = await authenticateCookieHeader(req.headers.cookie || '');\n    if (!session) return fail(res, 401, 'UNAUTHENTICATED', 'Sessão expirada ou inválida.');",
              "    const portalKind = requestedPortalKind(req);\n    const session = await authenticateCookieHeader(scopedCookieHeader(req, portalKind));\n    if (!session) return fail(res, 401, 'UNAUTHENTICATED', 'Sessão expirada ou inválida.');\n    if (portalKind && session.kind !== portalKind) return fail(res, 403, 'PORTAL_SESSION_MISMATCH', 'A sessão ativa não pertence a este portal.');"
          )

          replace_once(
              attachment,
              "        attachments: docs.map(publicAttachment),",
              "        attachments: docs.map(item => publicAttachment(item, session.kind)),"
          )
          replace_once(
              attachment,
              "        return ok(res, { attachment: publicAttachment(doc), persisted: true }, 201);",
              "        return ok(res, { attachment: publicAttachment(doc, session.kind), persisted: true }, 201);"
          )

          shared = 'workspace/shared/ticketEnterprise.js'
          replace_once(
              shared,
              "      const result = await api(`/api/attachment?action=upload&ticketId=${encodeURIComponent(ticketId)}`, {",
              "      const result = await api(`/api/attachment?action=upload&ticketId=${encodeURIComponent(ticketId)}&portal=${encodeURIComponent(roleKind)}`, {"
          )
          replace_once(
              shared,
              "      const data = await api(`/api/attachment?action=list&ticketId=${encodeURIComponent(ticketId)}`);",
              "      const data = await api(`/api/attachment?action=list&ticketId=${encodeURIComponent(ticketId)}&portal=${encodeURIComponent(roleKind)}`);"
          )
          replace_once(
              shared,
              "      document.querySelectorAll('[data-attachment-storage-state]').forEach(el => {\n        el.hidden = data.storageConfigured !== false;\n      });",
              "      let storageReady = data.storageConfigured !== false;\n      if (!storageReady) {\n        try {\n          const health = await api('/api/attachment?action=health');\n          storageReady = health?.storage?.connected === true;\n        } catch {}\n      }\n      document.querySelectorAll('[data-attachment-storage-state]').forEach(el => {\n        el.hidden = storageReady;\n      });"
          )

          contract = 'scripts/check-enterprise-contract.js'
          p = Path(contract)
          text = p.read_text(encoding='utf-8')
          if "const ticketEnterprise = read('workspace/shared/ticketEnterprise.js');" not in text:
              text = text.replace(
                  "const adminJs = read('workspace/admin/assets/js/admin.js');",
                  "const adminJs = read('workspace/admin/assets/js/admin.js');\nconst ticketEnterprise = read('workspace/shared/ticketEnterprise.js');"
              )
          marker = "must(attachment.includes(\"access: 'private'\"), 'attachments must use private Blob storage');"
          checks = "\nmust(attachment.includes('scopedCookieHeader'), 'attachments must bind authentication to the requesting portal');\nmust(attachment.includes('PORTAL_SESSION_MISMATCH'), 'attachment endpoint must reject portal/session mismatch');\nmust(ticketEnterprise.includes('portal=${encodeURIComponent(roleKind)}'), 'attachment requests must declare client/admin portal context');"
          if "attachment endpoint must reject portal/session mismatch" not in text:
              text = text.replace(marker, marker + checks)
          p.write_text(text, encoding='utf-8')

      - name: Install dependencies
        run: npm ci
      - name: Validate project
        run: |
          npm run check
          node --check api/attachment.js
          node --check workspace/shared/ticketEnterprise.js
          node --check scripts/check-enterprise-contract.js
          node scripts/check-enterprise-contract.js
      - name: Commit validated fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-attachment-session-binding.yml
          git add api/attachment.js workspace/shared/ticketEnterprise.js scripts/check-enterprise-contract.js
          git commit -m "fix: vincular anexos à sessão correta do portal"
          git push origin HEAD:fix/attachment-session-binding
