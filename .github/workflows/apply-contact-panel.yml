name: Apply full contact panel

on:
  push:
    branches:
      - fix/contact-panel-everywhere
    paths:
      - '.github/workflows/apply-contact-panel.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/contact-panel-everywhere

      - name: Replace simple contact buttons with the full ControlCenter panel
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          WIDGET = Path('pages/shared/contact-widget.html').read_text(encoding='utf-8')

          def update_page(path: Path, shared_prefix: str):
              text = path.read_text(encoding='utf-8')

              text = re.sub(r'\s*<style id="global-contact-float-style">.*?</style>\s*', '\n', text, flags=re.S)
              text = re.sub(r'\s*<a class="global-contact-float"[^>]*>.*?</a>\s*', '\n', text, flags=re.S)
              text = re.sub(r'\s*<a class="contact-float"[^>]*>.*?</a>\s*', '\n', text, flags=re.S)

              text = re.sub(r'\s*<link rel="stylesheet" href="[^"]*shared/contact-widget\.css">\s*', '\n', text)
              text = re.sub(r'\s*<script src="[^"]*shared/contact-widget\.js"></script>\s*', '\n', text)
              text = re.sub(r'\s*<!-- CONTROLCENTER CONTACT WIDGET -->.*?<!-- /CONTROLCENTER CONTACT WIDGET -->\s*', '\n', text, flags=re.S)

              css = f'<link rel="stylesheet" href="{shared_prefix}contact-widget.css">'
              js = f'<script src="{shared_prefix}contact-widget.js"></script>'

              if '</head>' not in text or '</body>' not in text:
                  raise RuntimeError(f'HTML structure not found in {path}')

              text = text.replace('</head>', css + '</head>', 1)
              text = text.replace('</body>', WIDGET + js + '</body>', 1)
              path.write_text(text, encoding='utf-8')

          one_level = [
              Path('pages/company/index.html'),
              Path('pages/clients/index.html'),
              Path('pages/contents/index.html'),
              *sorted(Path('pages/solutions').glob('*.html')),
          ]
          articles = sorted(Path('pages/contents/articles').glob('*.html'))

          for page in one_level:
              update_page(page, '../shared/')
          for page in articles:
              update_page(page, '../../shared/')

          print(f'Updated {len(one_level) + len(articles)} internal pages.')
          PY

      - name: Commit page updates
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/company/index.html pages/clients/index.html pages/solutions/*.html pages/contents/index.html pages/contents/articles/*.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "feat: use full ControlCenter contact panel across internal pages"
          git push origin HEAD:fix/contact-panel-everywhere
