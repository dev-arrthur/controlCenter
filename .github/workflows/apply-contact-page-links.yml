name: Apply contact page links

on:
  push:
    branches:
      - feat/contact-page-thynkxp
    paths:
      - '.github/workflows/apply-contact-page-links.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/contact-page-thynkxp

      - name: Point contact links to the dedicated contact page and link thynkXP credit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_footer_credit(text):
              pattern = r'<span class="site-footer-credit">\s*<span>Desenvolvido por</span>\s*<strong>thynkXP</strong>\s*</span>'
              replacement = '<a class="site-footer-credit" href="https://thynkxp.com.br/" target="_blank" rel="noopener noreferrer" aria-label="Site da thynkXP"><span>Desenvolvido por</span><strong>thynkXP</strong></a>'
              return re.sub(pattern, replacement, text, flags=re.S)

          def update(path, old_contact, new_contact):
              text = path.read_text(encoding='utf-8')
              text = text.replace(f'href="{old_contact}"', f'href="{new_contact}"')
              text = replace_footer_credit(text)
              path.write_text(text, encoding='utf-8')

          # Home: all existing #contato links now point to the dedicated page.
          update(Path('index.html'), '#contato', 'pages/contact/index.html')

          # Internal pages one directory below /pages.
          one_level = [
              Path('pages/company/index.html'),
              Path('pages/clients/index.html'),
              Path('pages/contents/index.html'),
              *sorted(Path('pages/solutions').glob('*.html')),
          ]
          for path in one_level:
              update(path, '../../index.html#contato', '../contact/index.html')

          # Articles live one level deeper.
          for path in sorted(Path('pages/contents/articles').glob('*.html')):
              update(path, '../../../index.html#contato', '../../contact/index.html')

          print('Updated contact links and thynkXP footer credit across the site.')
          PY

      - name: Commit navigation updates
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html pages/company/index.html pages/clients/index.html pages/contents/index.html pages/contents/articles/*.html pages/solutions/*.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "feat: direcionar contato e thynkXP em todo o site"
          git push origin HEAD:feat/contact-page-thynkxp
