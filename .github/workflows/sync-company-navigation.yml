name: Sync company navigation

on:
  push:
    paths:
      - '.github/workflows/sync-company-navigation.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update company links
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          home = Path('index.html')
          text = home.read_text(encoding='utf-8')
          text = text.replace('href="#empresa"', 'href="pages/company/index.html"')
          home.write_text(text, encoding='utf-8')

          for path in Path('pages/solutions').glob('*.html'):
              html = path.read_text(encoding='utf-8')
              html = html.replace('href="../../index.html#empresa"', 'href="../company/index.html"')
              path.write_text(html, encoding='utf-8')
          PY
      - name: Commit navigation changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html pages/solutions/*.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "feat: connect company page navigation"
          git push
