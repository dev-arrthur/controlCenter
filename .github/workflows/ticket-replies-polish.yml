name: Ticket replies polish

on:
  push:
    branches:
      - feat/ticket-replies-zoom-resolve

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply polish
        run: python3 scripts/fix-ticket-replies-polish.py
      - name: Install dependencies
        run: npm ci
      - name: Validate
        run: |
          npm run check
          node --check api/portal.js
          node --check workspace/client/assets/js/api.js
          node --check workspace/client/assets/js/portal.js
          node --check workspace/admin/assets/js/admin.js
          node --check workspace/shared/ticketEnterprise.js
          ! grep -Fq '\\n.message-actions' workspace/shared/portalEnterprise.css
          grep -q 'attachment-image-modal-tools' workspace/shared/portalEnterprise.css
          grep -q 'clearReplyTarget' workspace/admin/assets/js/admin.js
      - name: Commit validated polish and remove temporary files
        run: |
          rm -f scripts/fix-ticket-replies-polish.py .github/workflows/ticket-replies-polish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: polir zoom e estado de resposta dos chamados"
          git push
