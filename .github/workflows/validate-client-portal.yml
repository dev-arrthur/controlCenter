name: Validate client portal

on:
  push:
    branches:
      - feat/client-ticket-portal
    paths:
      - '.github/workflows/validate-client-portal.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/client-ticket-portal

      - name: Update Area do Cliente links
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_area_links(path, target):
              text = path.read_text(encoding='utf-8')
              def repl(match):
                  tag = match.group(0)
                  plain = re.sub(r'<[^>]+>', ' ', tag)
                  plain = re.sub(r'\s+', ' ', plain).strip()
                  if 'Área do Cliente' not in plain:
                      return tag
                  if re.search(r'href="[^"]*"', tag):
                      return re.sub(r'href="[^"]*"', f'href="{target}"', tag, count=1)
                  return tag
              text = re.sub(r'<a\b[^>]*>.*?</a>', repl, text, flags=re.S | re.I)
              path.write_text(text, encoding='utf-8')

          replace_area_links(Path('index.html'), 'workspace/client/loginClient.html')
          for path in [
              Path('pages/company/index.html'),
              Path('pages/clients/index.html'),
              Path('pages/contact/index.html'),
              Path('pages/contents/index.html'),
              *sorted(Path('pages/solutions').glob('*.html')),
          ]:
              replace_area_links(path, '../../workspace/client/loginClient.html')
          for path in sorted(Path('pages/contents/articles').glob('*.html')):
              replace_area_links(path, '../../../workspace/client/loginClient.html')
          PY

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Check project structure and syntax
        run: |
          npm run check
          node -c api/portal.js
          node -c workspace/client/assets/js/api.js
          node -c workspace/client/assets/js/portal.js
          node -e "const h=require('./api/portal'); if(typeof h!=='function') throw new Error('Invalid Vercel handler'); console.log('Vercel handler OK')"

      - name: Validate HTML and client links
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          portal_pages = sorted(Path('workspace/client').glob('*.html'))
          if len(portal_pages) != 6:
              raise SystemExit(f'Expected 6 portal HTML pages, found {len(portal_pages)}')

          for path in portal_pages:
              text = path.read_text(encoding='utf-8')
              ids = re.findall(r'\bid="([^"]+)"', text)
              duplicates = sorted({i for i in ids if ids.count(i) > 1})
              if duplicates:
                  raise SystemExit(f'Duplicate ids in {path}: {duplicates}')
              if 'assets/css/portal.css' not in text or 'assets/js/portal.js' not in text:
                  raise SystemExit(f'Missing portal assets in {path}')

          pages = [Path('index.html'), Path('pages/company/index.html'), Path('pages/clients/index.html'), Path('pages/contact/index.html'), Path('pages/contents/index.html'), *Path('pages/solutions').glob('*.html'), *Path('pages/contents/articles').glob('*.html')]
          checked = 0
          for path in pages:
              text = path.read_text(encoding='utf-8')
              for tag in re.findall(r'<a\b[^>]*>.*?</a>', text, flags=re.S | re.I):
                  plain = re.sub(r'\s+', ' ', re.sub(r'<[^>]+>', ' ', tag)).strip()
                  if 'Área do Cliente' in plain:
                      checked += 1
                      href = re.search(r'href="([^"]+)"', tag)
                      if not href or 'workspace/client/loginClient.html' not in href.group(1):
                          raise SystemExit(f'Invalid Area do Cliente link in {path}')
          if checked == 0:
              raise SystemExit('No Area do Cliente links found')

          api = Path('api/portal.js').read_text(encoding='utf-8')
          for marker in ['HttpOnly','SameSite=Lax','bcrypt.hash(newPassword, 12)','organizationId','auth_attempts','audit_logs']:
              if marker not in api:
                  raise SystemExit(f'Missing security marker: {marker}')
          print(f'Validated {len(portal_pages)} portal pages and {checked} Area do Cliente links.')
          PY

      - name: Commit generated lockfile and navigation links
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json index.html pages
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'chore: validar portal e conectar Área do Cliente'
          git push origin HEAD:feat/client-ticket-portal
